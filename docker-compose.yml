# ============================================================================
#  pgsqlmesh - Postgres + SQLMesh + Superset
#
#  Tre applikationer som hanger ihop i en dataplattform:
#
#     Postgres  ->  SQLMesh  ->  Superset
#     (lager)       (ELT)         (BI)
#
#  Postgres   : datalager. Innehaller raw.* (radata) och analytics.* (modeller).
#               Ar dessutom Supersets metadata-databas.
#  SQLMesh    : laser raw.* och bygger analytics.* (staging -> marts).
#  Superset   : laser analytics.* och visar dashboards.
#
#  version-manager : fjarde tjansten. Kontrollerar versioner + sakerhetsrisker
#                    och kan utfora uppdateringarna. Se README.md.
#
#  Versioner styrs helt fran .env (se den filen).
# ============================================================================

services:
  # -------------------------------------------------------------------------
  # 1. Postgres - datalager + Superset-metadata
  # -------------------------------------------------------------------------
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: pgsqlmesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Anvands av db/init/00-databases.sh for att skapa Supersets metadata-databas.
      SUPERSET_DB: ${SUPERSET_DB}
      SUPERSET_DB_USER: ${SUPERSET_DB_USER}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [data]

  # -------------------------------------------------------------------------
  # 2. SQLMesh - transformationslager (raw.* -> analytics.*)
  # -------------------------------------------------------------------------
  sqlmesh:
    build:
      context: ./sqlmesh
      args:
        SQLMESH_VERSION: ${SQLMESH_VERSION}
    image: pgsqlmesh/sqlmesh:${SQLMESH_VERSION}
    container_name: pgsqlmesh-sqlmesh
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SQLMESH_INTERVAL: "300"
    networks: [data]

  # -------------------------------------------------------------------------
  # 3. Superset - BI och dashboards
  # -------------------------------------------------------------------------
  superset:
    build:
      context: ./superset
      args:
        SUPERSET_IMAGE: ${SUPERSET_IMAGE}
    image: pgsqlmesh/superset
    container_name: pgsqlmesh-superset
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_PORT: "8088"
      # Metadata-databas
      SUPERSET_DB: ${SUPERSET_DB}
      SUPERSET_DB_USER: ${SUPERSET_DB_USER}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
      # Datalager som skall visas i Superset
      WAREHOUSE_DB: ${POSTGRES_DB}
      WAREHOUSE_USER: ${POSTGRES_USER}
      WAREHOUSE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${SUPERSET_PORT}:8088"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks: [data]

  # -------------------------------------------------------------------------
  # 4. Version Manager - kontroll och uppdatering av komponentversioner
  # -------------------------------------------------------------------------
  version-manager:
    build:
      context: ./version-manager
    image: pgsqlmesh/version-manager:1.0.0
    container_name: pgsqlmesh-version-manager
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Sokvagen till projektet (samma absoluta sokvag pa host och i containern)
      PROJECT_DIR: ${PWD}
      COMPOSE_FILE: ${PWD}/docker-compose.yml
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      # Tjanster som far uppdateras
      MANAGED_SERVICES: postgres,superset,sqlmesh
      # Lasning av warehouse-databasen (for portalens dataflik)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Docker-socket: later version-manager bygga/starta om tjanster.
      - /var/run/docker.sock:/var/run/docker.sock
      # Projektkatalogen pa SAMMA sokvag, sa att compose-relative volymer stämmer.
      - ${PWD}:${PWD}
    ports:
      - "${VERSION_MANAGER_PORT}:8000"
    networks: [data]

volumes:
  pgdata:

networks:
  data:
    driver: bridge
